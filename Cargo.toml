[package]
name = "codex-meter"
version = "0.1.0"
edition = "2024"
description = "A lightweight terminal meter for local Codex usage"
license = "MIT"
repository = "https://github.com/h3nock/codex-meter"

[dependencies]
crossterm = "0.29.0"
memchr = "2.8.1"
ratatui = "0.30.0"
rusqlite = "0.37.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
ureq = "2.12.1"
